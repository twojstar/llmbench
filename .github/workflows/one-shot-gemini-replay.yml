name: One-shot Gemini replay

on: # yamllint disable-line rule:truthy
  push:
    branches: [gptomek/gemini-thought-signatures]

jobs:
  validate:
    if: github.event.head_commit.message != 'fix(gemini) preserve thought signatures'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Read Gradle version
        id: gradle
        run: .github/scripts/gradle-version.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Generate Gradle wrapper if missing
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi

      - name: Apply focused patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/one-shot-gemini-replay.py')
          text = path.read_text()
          payload = '[{"role":"model","parts":[{"text":"gemini answer"}]},{"role":"model","parts":[{"text":"","thoughtSignature":"opaque-signature"}]}]'
          old = '        val replayState = ' + '"""' + payload + '"""'
          escaped = payload.replace('"', '\\"')
          new = '        val replayState = "' + escaped + '"'
          assert text.count(old) == 1
          text = text.replace(old, new)
          marker = '    """    @Test\n    fun geminiHistoryReplaysOpaqueModelContentsIncludingSignatureOnlyChunk() {'
          raw_marker = '    r"""    @Test\n    fun geminiHistoryReplaysOpaqueModelContentsIncludingSignatureOnlyChunk() {'
          assert text.count(marker) == 1
          path.write_text(text.replace(marker, raw_marker))
          PY
          python .github/scripts/one-shot-gemini-replay.py

      - name: Validate
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :shared:desktopTest --stacktrace

      - name: Package validated patch
        run: |
          git diff --binary -- . \
            ':(exclude).github/workflows/one-shot-gemini-replay.yml' \
            ':(exclude).github/scripts/one-shot-gemini-replay.py' > /tmp/gemini.patch
          test -s /tmp/gemini.patch

      - uses: actions/upload-artifact@v7
        with:
          name: gemini-replay-patch
          path: /tmp/gemini.patch
          if-no-files-found: error

  commit:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gptomek/gemini-thought-signatures
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: gemini-replay-patch
          path: /tmp/gemini-patch

      - name: Commit verified product changes
        run: |
          git apply --index /tmp/gemini-patch/gemini.patch
          git config user.name "GPTomek"
          git config user.email "314538226+gptomek[bot]@users.noreply.github.com"
          git commit -m "fix(gemini) preserve thought signatures"
          git push origin HEAD:gptomek/gemini-thought-signatures
