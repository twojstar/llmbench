name: One-shot Markdown recents final

on: # yamllint disable-line rule:truthy
  push:
    branches: [gptomek/markdown-recents]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Read Gradle version
        id: gradle
        run: .github/scripts/gradle-version.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Generate Gradle wrapper if missing
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi

      - name: Reuse asserted patch and fix app tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/one-shot-markdown-recents.yml").read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          patch_script = textwrap.dedent(workflow[start:end])
          exec(compile(patch_script, "markdown_recents_patch.py", "exec"), {})

          test_path = Path("app/src/test/java/com/twojstar/llmbench/data/document/MarkdownRecentDocumentsCodecTest.kt")
          tests = test_path.read_text()
          old_imports = "import kotlin.test.Test\nimport kotlin.test.assertEquals\nimport kotlin.test.assertTrue\n"
          new_imports = "import org.junit.Assert.assertEquals\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n"
          if tests.count(old_imports) != 1:
              raise SystemExit("Expected one kotlin.test import block")
          tests = tests.replace(old_imports, new_imports)

          old_assertion = "        assertEquals(emptyList(), MarkdownRecentDocumentsCodec.decode(byteArrayOf(1, 2, 3, 4)))"
          new_assertion = "        assertTrue(MarkdownRecentDocumentsCodec.decode(byteArrayOf(1, 2, 3, 4)).isEmpty())"
          if tests.count(old_assertion) != 1:
              raise SystemExit("Expected one malformed-payload assertion")
          test_path.write_text(tests.replace(old_assertion, new_assertion))
          PY

      - name: Verify Markdown recents
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :shared:desktopTest --stacktrace

      - name: Commit patch and remove one-shot workflows
        run: |
          git config user.name "gptomek[bot]"
          git config user.email "314538226+gptomek[bot]@users.noreply.github.com"
          git add app/src/main/java/com/twojstar/llmbench/data/document/MarkdownRecentDocumentsCodec.kt
          git add app/src/main/java/com/twojstar/llmbench/data/document/MarkdownRecentDocumentsStore.kt
          git add app/src/main/java/com/twojstar/llmbench/ui/screens/MarkdownWorkspaceScreen.kt
          git add app/src/test/java/com/twojstar/llmbench/data/document/MarkdownRecentDocumentsCodecTest.kt
          git rm .github/workflows/one-shot-markdown-recents.yml
          git rm .github/workflows/one-shot-markdown-recents-retry.yml
          git rm .github/workflows/one-shot-markdown-recents-final.yml
          git commit -m "feat: add recent Markdown document shortcuts"
          git push origin HEAD:gptomek/markdown-recents
