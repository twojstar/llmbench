name: One-shot Claude merge gate

on:
  push:
    branches:
      - gptomek/claude-thinking-replay
    paths:
      - .github/workflows/one-shot-claude-merge-gate.yml
      - .github/scripts/one-shot-claude-merge-gate.py

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Read Gradle version
        id: gradle-version
        shell: bash
        run: .github/scripts/gradle-version.sh
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle-version.outputs.version }}
          cache-read-only: true
      - name: Generate Gradle wrapper if missing
        shell: bash
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "${{ steps.gradle-version.outputs.version }}"
            git checkout -- gradle/wrapper/gradle-wrapper.properties
          fi
      - name: Apply final Claude merge fixes
        run: python .github/scripts/one-shot-claude-merge-gate.py
      - name: Validate full gate
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :shared:desktopTest --stacktrace
      - name: Commit verified fix as GPTomek
        shell: bash
        run: |
          git fetch origin gptomek/claude-thinking-replay
          remote_sha="$(git rev-parse origin/gptomek/claude-thinking-replay)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Branch moved during validation: expected $GITHUB_SHA, got $remote_sha" >&2
            exit 1
          fi

          rm .github/scripts/one-shot-claude-merge-gate.py
          rm .github/workflows/one-shot-claude-merge-gate.yml
          rm -f gradle/wrapper/gradle-wrapper.jar
          git checkout -- gradle/wrapper/gradle-wrapper.properties

          unexpected="$(git diff --name-only | grep -Ev '^(app/src/main/java/com/twojstar/llmbench/data/engine/AiChatService.kt|app/src/main/java/com/twojstar/llmbench/ui/viewmodel/StudioViewModel.kt|app/src/test/java/com/twojstar/llmbench/data/engine/AiChatServiceTest.kt|\.github/scripts/one-shot-claude-merge-gate.py|\.github/workflows/one-shot-claude-merge-gate.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

          git config user.name "GPTomek"
          git config user.email "314538226+gptomek[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(claude) preserve partial replay safety"
          git push origin HEAD:gptomek/claude-thinking-replay
