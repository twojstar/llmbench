name: One-shot response Markdown welcome fix
on:
  push:
    branches: [gptomek/response-markdown-asset]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gptomek/response-markdown-asset
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - id: gradle
        run: .github/scripts/gradle-version.sh
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}
      - name: Generate wrapper if missing
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then gradle wrapper --gradle-version "$GRADLE_VERSION"; fi
      - name: Exclude onboarding from response assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/twojstar/llmbench/ui/screens/ChatScreen.kt')
          s=p.read_text()
          old='''        !message.isPartial &&\n        !message.isError &&\n        message.text.isNotBlank()'''
          new='''        !message.isPartial &&\n        !message.isError &&\n        message.provider != null &&\n        message.provider != AiProvider.ALL &&\n        message.text.isNotBlank()'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          t=Path('app/src/test/java/com/twojstar/llmbench/ui/screens/ChatResponseMarkdownEligibilityTest.kt')
          s=t.read_text()
          s=s.replace('''val message = ModelChatMessage(id = "a1", sender = "assistant", text = "Useful answer")''','''val message = ModelChatMessage(\n            id = "a1",\n            sender = "assistant",\n            provider = com.twojstar.llmbench.data.model.AiProvider.CHATGPT,\n            text = "Useful answer"\n        )''')
          s=s.replace('''val stoppedPartial = ModelChatMessage(\n            id = "a2",\n            sender = "assistant",\n            text = "Half of an answer",''','''val stoppedPartial = ModelChatMessage(\n            id = "a2",\n            sender = "assistant",\n            provider = com.twojstar.llmbench.data.model.AiProvider.CHATGPT,\n            text = "Half of an answer",''')
          s=s.replace('''val error = ModelChatMessage(\n            id = "a3",\n            sender = "assistant",\n            text = "Provider failed",''','''val error = ModelChatMessage(\n            id = "a3",\n            sender = "assistant",\n            provider = com.twojstar.llmbench.data.model.AiProvider.CHATGPT,\n            text = "Provider failed",''')
          s=s.replace('''val complete = ModelChatMessage(id = "a4", sender = "assistant", text = "Complete")''','''val complete = ModelChatMessage(\n            id = "a4",\n            sender = "assistant",\n            provider = com.twojstar.llmbench.data.model.AiProvider.CHATGPT,\n            text = "Complete"\n        )''')
          insert='''\n    @Test\n    fun onboardingCardIsNotAResponseAsset() {\n        val welcome = ModelChatMessage(\n            id = "welcome",\n            sender = "assistant",\n            provider = com.twojstar.llmbench.data.model.AiProvider.ALL,\n            text = "Welcome"\n        )\n\n        assertFalse(canOpenResponseAsMarkdown(welcome, false, false))\n    }\n'''
          assert s.endswith('}\n')
          t.write_text(s[:-2]+insert+'}\n')
          PY
      - name: Build, test and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :shared:desktopTest --stacktrace
      - name: Commit verified fix as GPTomek
        run: |
          rm .github/workflows/one-shot-response-markdown-welcome-fix.yml
          git config user.name "gptomek[bot]"
          git config user.email "314538226+gptomek[bot]@users.noreply.github.com"
          git add app/src/main/java/com/twojstar/llmbench/ui/screens/ChatScreen.kt app/src/test/java/com/twojstar/llmbench/ui/screens/ChatResponseMarkdownEligibilityTest.kt .github/workflows/one-shot-response-markdown-welcome-fix.yml
          git commit -m "fix: exclude chat onboarding from response assets"
          git push origin HEAD:gptomek/response-markdown-asset
