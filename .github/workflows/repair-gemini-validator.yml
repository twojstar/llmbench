name: Repair Gemini validator

on: # yamllint disable-line rule:truthy
  push:
    branches: [gptomek/gemini-thought-signatures]

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gptomek/gemini-thought-signatures
      - name: Repair condition and self-delete
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/one-shot-gemini-thought-signatures.yml')
          text = path.read_text()
          old = "    if: github.event.head_commit.message != 'fix: preserve Gemini thought signatures'"
          new = "    if: \"${{ github.event.head_commit.message != 'fix: preserve Gemini thought signatures' }}\""
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/repair-gemini-validator.yml
          git add .github/workflows/one-shot-gemini-thought-signatures.yml
          git config user.name "GPTomek"
          git config user.email "314538226+gptomek[bot]@users.noreply.github.com"
          git commit -m "chore: repair Gemini validator"
          git push origin HEAD:gptomek/gemini-thought-signatures
