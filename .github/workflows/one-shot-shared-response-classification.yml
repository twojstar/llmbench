name: One-shot shared response classification

on:
  push:
    branches:
      - gptomek/response-markdown-asset
    paths:
      - .github/workflows/one-shot-shared-response-classification.yml

jobs:
  validate:
    if: github.actor == 'trvny'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gptomek/response-markdown-asset
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Read Gradle version
        id: gradle
        run: .github/scripts/gradle-version.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Generate Gradle wrapper if missing
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi

      - name: Delegate response classification to shared
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/twojstar/llmbench/ui/screens/ChatScreen.kt')
          text = path.read_text()

          import_anchor = 'import com.twojstar.llmbench.data.model.renderChatMarkdown\n'
          import_line = 'import com.twojstar.llmbench.data.model.isCompletedAssistantResponse\n'
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('unexpected ChatScreen import anchor')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old = '''internal fun canOpenResponseAsMarkdown(
              message: ModelChatMessage,
              isPreparingChatMarkdown: Boolean,
              isWorkspaceBusy: Boolean
          ): Boolean =
              !isPreparingChatMarkdown &&
                  !isWorkspaceBusy &&
                  !message.isPartial &&
                  !message.isError &&
                  message.sender == CHAT_ROLE_ASSISTANT &&
                  message.provider != null &&
                  message.provider != AiProvider.ALL &&
                  message.text.isNotBlank()
          '''
          new = '''internal fun canOpenResponseAsMarkdown(
              message: ModelChatMessage,
              isPreparingChatMarkdown: Boolean,
              isWorkspaceBusy: Boolean
          ): Boolean =
              !isPreparingChatMarkdown &&
                  !isWorkspaceBusy &&
                  message.isCompletedAssistantResponse()
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Android response predicate, found {text.count(old)}')
          text = text.replace(old, new, 1)

          text = text.replace(
              'import com.twojstar.llmbench.data.model.CHAT_ROLE_ASSISTANT\n',
              '',
              1
          )
          path.write_text(text)
          PY

      - name: Validate
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :shared:desktopTest --stacktrace

      - name: Package validated patch
        run: git diff --binary -- app/src/main/java/com/twojstar/llmbench/ui/screens/ChatScreen.kt > response-classification.patch

      - uses: actions/upload-artifact@v7
        with:
          name: response-classification-patch
          path: response-classification.patch
          if-no-files-found: error

  commit:
    needs: validate
    if: github.actor == 'trvny'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gptomek/response-markdown-asset
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: response-classification-patch

      - name: Apply validated patch and self-delete
        run: |
          git apply --check response-classification.patch
          git apply response-classification.patch
          rm response-classification.patch
          rm .github/workflows/one-shot-shared-response-classification.yml
          git diff --check

      - name: Commit verified delegation
        run: |
          git config user.name 'gptomek[bot]'
          git config user.email '314538226+gptomek[bot]@users.noreply.github.com'
          git add app/src/main/java/com/twojstar/llmbench/ui/screens/ChatScreen.kt .github/workflows/one-shot-shared-response-classification.yml
          git commit -m 'refactor: share response classification'
          git push origin HEAD:gptomek/response-markdown-asset
