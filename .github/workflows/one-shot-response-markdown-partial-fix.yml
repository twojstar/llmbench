name: One-shot response Markdown partial fix

on:
  push:
    branches: [gptomek/response-markdown-asset]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gptomek/response-markdown-asset
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Read Gradle version
        id: gradle
        run: .github/scripts/gradle-version.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Generate Gradle wrapper if missing
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi

      - name: Harden response Markdown eligibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          screen = Path("app/src/main/java/com/twojstar/llmbench/ui/screens/ChatScreen.kt")
          text = screen.read_text()

          anchor = '''private data class PendingMarkdownAsset(\n    val text: String,\n    val displayName: String,\n    val sourceDescription: String\n)\n\n'''
          helper = '''private data class PendingMarkdownAsset(\n    val text: String,\n    val displayName: String,\n    val sourceDescription: String\n)\n\ninternal fun canOpenResponseAsMarkdown(\n    message: ModelChatMessage,\n    isPreparingChatMarkdown: Boolean,\n    isWorkspaceBusy: Boolean\n): Boolean =\n    !isPreparingChatMarkdown &&\n        !isWorkspaceBusy &&\n        !message.isPartial &&\n        !message.isError &&\n        message.text.isNotBlank()\n\n'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, helper, 1)

          old = '''                    canOpenMarkdown =\n                        !isPreparingChatMarkdown &&\n                            (!message.isPartial || !uiState.isChatGenerating) &&\n                            message.text.isNotBlank() &&\n                            !message.isError,\n'''
          new = '''                    canOpenMarkdown = canOpenResponseAsMarkdown(\n                        message = message,\n                        isPreparingChatMarkdown = isPreparingChatMarkdown,\n                        isWorkspaceBusy = markdownUiState.isBusy\n                    ),\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          screen.write_text(text)

          test = Path("app/src/test/java/com/twojstar/llmbench/ui/screens/ChatResponseMarkdownEligibilityTest.kt")
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''package com.twojstar.llmbench.ui.screens\n\nimport com.twojstar.llmbench.data.model.ModelChatMessage\nimport org.junit.Assert.assertFalse\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n\nclass ChatResponseMarkdownEligibilityTest {\n    @Test\n    fun completedResponseIsEligible() {\n        val message = ModelChatMessage(id = "a1", sender = "assistant", text = "Useful answer")\n\n        assertTrue(\n            canOpenResponseAsMarkdown(\n                message = message,\n                isPreparingChatMarkdown = false,\n                isWorkspaceBusy = false\n            )\n        )\n    }\n\n    @Test\n    fun partialResponseRemainsIneligibleAfterCancellation() {\n        val stoppedPartial = ModelChatMessage(\n            id = "a2",\n            sender = "assistant",\n            text = "Half of an answer",\n            isPartial = true\n        )\n\n        assertFalse(\n            canOpenResponseAsMarkdown(\n                message = stoppedPartial,\n                isPreparingChatMarkdown = false,\n                isWorkspaceBusy = false\n            )\n        )\n    }\n\n    @Test\n    fun errorAndBusyStatesAreIneligible() {\n        val error = ModelChatMessage(\n            id = "a3",\n            sender = "assistant",\n            text = "Provider failed",\n            isError = true\n        )\n        val complete = ModelChatMessage(id = "a4", sender = "assistant", text = "Complete")\n\n        assertFalse(canOpenResponseAsMarkdown(error, false, false))\n        assertFalse(canOpenResponseAsMarkdown(complete, true, false))\n        assertFalse(canOpenResponseAsMarkdown(complete, false, true))\n    }\n}\n''')
          PY

      - name: Build, test and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :shared:desktopTest --stacktrace

      - name: Commit verified fix as GPTomek
        run: |
          rm .github/workflows/one-shot-response-markdown-partial-fix.yml
          git config user.name "gptomek[bot]"
          git config user.email "314538226+gptomek[bot]@users.noreply.github.com"
          git add app/src/main/java/com/twojstar/llmbench/ui/screens/ChatScreen.kt app/src/test/java/com/twojstar/llmbench/ui/screens/ChatResponseMarkdownEligibilityTest.kt .github/workflows/one-shot-response-markdown-partial-fix.yml
          git commit -m "fix: require complete responses for Markdown assets"
          git push origin HEAD:gptomek/response-markdown-asset
