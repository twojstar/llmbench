name: One-shot OpenAI review cleanup

on: # yamllint disable-line rule:truthy
  push:
    branches: [gptomek/openai-stateless-reasoning]

jobs:
  cleanup:
    if: github.event.head_commit.message != 'test(openai) reuse stream fixture'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Read Gradle version
        id: gradle
        run: .github/scripts/gradle-version.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Generate Gradle wrapper if missing
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
            git checkout -- gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Extract repeated SSE fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/test/java/com/twojstar/llmbench/data/engine/AiChatServiceTest.kt')
          text = path.read_text()
          literal = '"data: {\\"type\\":\\"response.output_text.delta\\",\\"delta\\":\\"hello\\"}\\n\\n"'
          count = text.count(literal)
          assert count >= 3, f'expected >=3 repeated SSE literals, found {count}'
          text = text.replace(literal, 'TEST_OPENAI_TEXT_DELTA_SSE')
          marker = 'private const val TEST_OPENAI_REASONING_INCLUDE = "reasoning.encrypted_content"\n'
          assert marker in text
          text = text.replace(
              marker,
              marker + 'private const val TEST_OPENAI_TEXT_DELTA_SSE = "data: {\\"type\\":\\"response.output_text.delta\\",\\"delta\\":\\"hello\\"}\\n\\n"\n',
              1,
          )
          path.write_text(text)
          PY

      - name: Validate
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Commit verified cleanup as GPTomek
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          git add app/src/test/java/com/twojstar/llmbench/data/engine/AiChatServiceTest.kt
          git diff --cached --quiet && exit 1 || true
          git fetch origin gptomek/openai-stateless-reasoning
          test "$(git rev-parse origin/gptomek/openai-stateless-reasoning)" = "$VALIDATED_SHA"
          git config user.name "GPTomek"
          git config user.email "314538226+gptomek[bot]@users.noreply.github.com"
          git commit -m "test(openai) reuse stream fixture"
          git push origin HEAD:gptomek/openai-stateless-reasoning
