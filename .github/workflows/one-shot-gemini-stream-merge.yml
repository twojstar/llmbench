name: One-shot Gemini stream replay fix

on: # yamllint disable-line rule:truthy
  push:
    branches: [gptomek/gemini-thought-signatures]

jobs:
  validate:
    if: github.event.head_commit.message != 'fix(gemini) merge streamed replay parts'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Read Gradle version
        id: gradle
        run: .github/scripts/gradle-version.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Generate Gradle wrapper if missing
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
            git checkout -- gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Apply focused patch
        run: python .github/scripts/one-shot-gemini-stream-merge.py

      - name: Validate
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :shared:desktopTest --stacktrace

      - name: Package validated patch
        run: |
          git diff --binary -- \
            app/src/main/java/com/twojstar/llmbench/data/engine/AiChatService.kt \
            app/src/test/java/com/twojstar/llmbench/data/engine/AiChatServiceTest.kt > /tmp/gemini-stream.patch
          test -s /tmp/gemini-stream.patch

      - uses: actions/upload-artifact@v7
        with:
          name: gemini-stream-replay-patch
          path: /tmp/gemini-stream.patch
          if-no-files-found: error

  commit:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gptomek/gemini-thought-signatures
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: gemini-stream-replay-patch
          path: /tmp/gemini-stream-patch

      - name: Commit verified product changes
        run: |
          git apply --index /tmp/gemini-stream-patch/gemini-stream.patch
          git config user.name "GPTomek"
          git config user.email "314538226+gptomek[bot]@users.noreply.github.com"
          git commit -m "fix(gemini) merge streamed replay parts"
          git push origin HEAD:gptomek/gemini-thought-signatures
