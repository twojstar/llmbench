name: One-shot response Markdown asset

on:
  push:
    branches: [gptomek/response-markdown-asset]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gptomek/response-markdown-asset
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Read Gradle version
        id: gradle
        run: .github/scripts/gradle-version.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Generate Gradle wrapper if missing
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi

      - name: Add response-to-Markdown action
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/twojstar/llmbench/ui/screens/ChatScreen.kt")
          text = path.read_text()

          old = '''private const val CHAT_MARKDOWN_EXPORT_NAME = "llmbench-chat.md"\nprivate const val MAX_CHAT_PROMPT_IMPORT_CHARS = 128 * 1024\n'''
          new = '''private const val CHAT_MARKDOWN_EXPORT_NAME = "llmbench-chat.md"\nprivate const val CHAT_RESPONSE_MARKDOWN_NAME = "llmbench-response.md"\nprivate const val MAX_CHAT_PROMPT_IMPORT_CHARS = 128 * 1024\n\nprivate data class PendingMarkdownAsset(\n    val text: String,\n    val displayName: String\n)\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    var showModelMenu by remember { mutableStateOf(false) }\n    var showChatActionsMenu by remember { mutableStateOf(false) }\n    var pendingChatMarkdown by remember { mutableStateOf<String?>(null) }\n    var pendingMarkdownPromptReplacement by remember { mutableStateOf<String?>(null) }\n'''
          new = '''    var showModelMenu by remember { mutableStateOf(false) }\n    var showChatActionsMenu by remember { mutableStateOf(false) }\n    var pendingMarkdownAsset by remember { mutableStateOf<PendingMarkdownAsset?>(null) }\n    var pendingMarkdownPromptReplacement by remember { mutableStateOf<String?>(null) }\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    fun openChatAsMarkdown(markdown: String, allowDiscardDirty: Boolean) {\n        when (\n            markdownWorkspaceViewModel.openExternalText(\n                text = markdown,\n                displayName = CHAT_MARKDOWN_EXPORT_NAME,\n                allowDiscardDirty = allowDiscardDirty\n            )\n        ) {\n            ExternalMarkdownOpenResult.OPENED -> {\n                pendingChatMarkdown = null\n                viewModel.selectTab(NavigationTab.YAML)\n            }\n            ExternalMarkdownOpenResult.NEEDS_DISCARD -> pendingChatMarkdown = markdown\n            ExternalMarkdownOpenResult.BUSY -> viewModel.showSnackbar(\n                "Markdown workspace is still restoring or busy. Try again when it is ready."\n            )\n            ExternalMarkdownOpenResult.TOO_LARGE -> viewModel.showSnackbar(\n                "Chat export is larger than the 8 MiB Markdown workspace limit."\n            )\n        }\n    }\n'''
          new = '''    fun openMarkdownAsset(\n        text: String,\n        displayName: String,\n        allowDiscardDirty: Boolean\n    ) {\n        when (\n            markdownWorkspaceViewModel.openExternalText(\n                text = text,\n                displayName = displayName,\n                allowDiscardDirty = allowDiscardDirty\n            )\n        ) {\n            ExternalMarkdownOpenResult.OPENED -> {\n                pendingMarkdownAsset = null\n                viewModel.selectTab(NavigationTab.YAML)\n            }\n            ExternalMarkdownOpenResult.NEEDS_DISCARD -> {\n                pendingMarkdownAsset = PendingMarkdownAsset(text, displayName)\n            }\n            ExternalMarkdownOpenResult.BUSY -> viewModel.showSnackbar(\n                "Markdown workspace is still restoring or busy. Try again when it is ready."\n            )\n            ExternalMarkdownOpenResult.TOO_LARGE -> viewModel.showSnackbar(\n                "Markdown asset is larger than the 8 MiB workspace limit."\n            )\n        }\n    }\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''                                                        openChatAsMarkdown(\n                                                            markdown = markdown,\n                                                            allowDiscardDirty = false\n                                                        )\n'''
          new = '''                                                        openMarkdownAsset(\n                                                            text = markdown,\n                                                            displayName = CHAT_MARKDOWN_EXPORT_NAME,\n                                                            allowDiscardDirty = false\n                                                        )\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''                    onCopyText = { text ->\n                        val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager\n                        val clip = ClipData.newPlainText("AI Message", text)\n                        clipboard.setPrimaryClip(clip)\n                        viewModel.showSnackbar("Copied to clipboard")\n                    },\n                    onRetryPrompt = { prompt ->\n                        viewModel.sendChatMessage(prompt)\n                    }\n'''
          new = '''                    onCopyText = { text ->\n                        val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager\n                        val clip = ClipData.newPlainText("AI Message", text)\n                        clipboard.setPrimaryClip(clip)\n                        viewModel.showSnackbar("Copied to clipboard")\n                    },\n                    onOpenAsMarkdown = { text ->\n                        openMarkdownAsset(\n                            text = text,\n                            displayName = CHAT_RESPONSE_MARKDOWN_NAME,\n                            allowDiscardDirty = false\n                        )\n                    },\n                    canOpenAsMarkdown = !markdownUiState.isBusy,\n                    onRetryPrompt = { prompt ->\n                        viewModel.sendChatMessage(prompt)\n                    }\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    pendingChatMarkdown?.let { markdown ->\n        AlertDialog(\n            onDismissRequest = { pendingChatMarkdown = null },\n            title = { Text("Replace unsaved Markdown draft?") },\n            text = {\n                Text(\n                    "${markdownUiState.displayName} has edits that have not been exported. Discard them and open this chat snapshot as a new local Markdown draft?"\n                )\n            },\n            confirmButton = {\n                Button(\n                    onClick = { openChatAsMarkdown(markdown, allowDiscardDirty = true) },\n                    modifier = Modifier.testTag("btn_confirm_chat_markdown_replace")\n                ) {\n                    Text("Discard and open")\n                }\n            },\n            dismissButton = {\n                TextButton(onClick = { pendingChatMarkdown = null }) { Text("Cancel") }\n            }\n        )\n    }\n'''
          new = '''    pendingMarkdownAsset?.let { pending ->\n        AlertDialog(\n            onDismissRequest = { pendingMarkdownAsset = null },\n            title = { Text("Replace unsaved Markdown draft?") },\n            text = {\n                Text(\n                    "${markdownUiState.displayName} has edits that have not been exported. Discard them and open ${pending.displayName} as a new local Markdown draft?"\n                )\n            },\n            confirmButton = {\n                Button(\n                    onClick = {\n                        openMarkdownAsset(\n                            text = pending.text,\n                            displayName = pending.displayName,\n                            allowDiscardDirty = true\n                        )\n                    },\n                    modifier = Modifier.testTag("btn_confirm_markdown_asset_replace")\n                ) {\n                    Text("Discard and open")\n                }\n            },\n            dismissButton = {\n                TextButton(onClick = { pendingMarkdownAsset = null }) { Text("Cancel") }\n            }\n        )\n    }\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''fun ChatMessageItem(\n    message: ModelChatMessage,\n    onCopyText: (String) -> Unit,\n    onRetryPrompt: (String) -> Unit\n) {\n'''
          new = '''fun ChatMessageItem(\n    message: ModelChatMessage,\n    onCopyText: (String) -> Unit,\n    onOpenAsMarkdown: (String) -> Unit,\n    canOpenAsMarkdown: Boolean,\n    onRetryPrompt: (String) -> Unit\n) {\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''                    ) {\n                        IconButton(\n                            onClick = { onCopyText(message.text) },\n                            modifier = Modifier.size(28.dp)\n                        ) {\n'''
          new = '''                    ) {\n                        IconButton(\n                            onClick = { onOpenAsMarkdown(message.text) },\n                            enabled = canOpenAsMarkdown &&\n                                !message.isPartial &&\n                                !message.isError &&\n                                message.text.isNotBlank(),\n                            modifier = Modifier\n                                .size(28.dp)\n                                .testTag("open_message_markdown_${message.id}")\n                        ) {\n                            Icon(\n                                imageVector = Icons.Outlined.Description,\n                                contentDescription = "Open message as Markdown",\n                                tint = MaterialTheme.colorScheme.onSurfaceVariant,\n                                modifier = Modifier.size(15.dp)\n                            )\n                        }\n                        IconButton(\n                            onClick = { onCopyText(message.text) },\n                            modifier = Modifier.size(28.dp)\n                        ) {\n'''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Build, test and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :shared:desktopTest --stacktrace

      - name: Commit verified product change as GPTomek
        run: |
          rm .github/workflows/one-shot-response-markdown.yml
          git config user.name "gptomek[bot]"
          git config user.email "314538226+gptomek[bot]@users.noreply.github.com"
          git add app/src/main/java/com/twojstar/llmbench/ui/screens/ChatScreen.kt .github/workflows/one-shot-response-markdown.yml
          git commit -m "feat: open AI responses as Markdown assets"
          git push origin HEAD:gptomek/response-markdown-asset
