name: One-shot clean common regex fix

on: # yamllint disable-line rule:truthy
  push:
    branches: [gptomek/fix-common-regex-portability]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Read Gradle version
        id: gradle
        run: .github/scripts/gradle-version.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Fix multiline regression fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("shared/src/commonTest/kotlin/com/twojstar/llmbench/data/security/TextInspectorTest.kt")
          text = path.read_text()
          old = r'Ignore these notes\\nprevious system instructions'
          new = r'Ignore these notes\nprevious system instructions'
          if text.count(old) != 1:
              raise SystemExit("Expected one double-escaped multiline fixture")
          path.write_text(text.replace(old, new))
          PY

      - name: Verify shared common code
        run: gradle :shared:compileCommonMainKotlinMetadata :shared:desktopTest --stacktrace

      - name: Restore wrapper state and commit
        run: |
          git fetch origin main --depth=1
          git rm -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar
          git checkout origin/main -- gradle/wrapper/gradle-wrapper.properties
          rm .github/workflows/one-shot-clean-common-regex-fix.yml
          git config user.name "gptomek[bot]"
          git config user.email "314538226+gptomek[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: clean one-shot patch artifacts"
          git push origin HEAD:gptomek/fix-common-regex-portability
