name: One-shot response Markdown disabled tint fix

on:
  push:
    branches:
      - gptomek/response-markdown-asset
    paths:
      - .github/workflows/one-shot-response-markdown-disabled-tint.yml

permissions:
  contents: write

jobs:
  patch-validate-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gptomek/response-markdown-asset
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply focused tint fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/twojstar/llmbench/ui/screens/ChatScreen.kt')
          lines = path.read_text().splitlines(keepends=True)
          marker = 'contentDescription = "Open response as Markdown"'
          tint = 'tint = MaterialTheme.colorScheme.onSurfaceVariant'
          hits = [i for i in range(len(lines) - 1) if marker in lines[i] and tint in lines[i + 1]]
          if len(hits) != 1:
              raise SystemExit(f'expected one target, found {len(hits)}')
          del lines[hits[0] + 1]
          path.write_text(''.join(lines))
          PY

      - name: Validate
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :shared:desktopTest --stacktrace

      - name: Commit verified fix and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-response-markdown-disabled-tint.yml
          git config user.name 'gptomek[bot]'
          git config user.email '314538226+gptomek[bot]@users.noreply.github.com'
          git add app/src/main/java/com/twojstar/llmbench/ui/screens/ChatScreen.kt .github/workflows/one-shot-response-markdown-disabled-tint.yml
          git commit -m 'fix: preserve disabled Markdown action tint'
          git push origin HEAD:gptomek/response-markdown-asset
