name: Android CI

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md"]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Read Gradle version
        id: gradle
        run: .github/scripts/gradle-version.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Generate Gradle wrapper if missing
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi

      - name: Build, test & lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: llmbench-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
