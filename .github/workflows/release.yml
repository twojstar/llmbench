name: Rolling release

on: # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "shared/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/scripts/gradle-version.sh"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: llmbench-rolling-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish rolling release
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve app version
        id: release
        run: |
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          if [ -z "$version" ]; then
            echo "::error::app/build.gradle.kts has no versionName."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Read Gradle version
        id: gradle
        run: .github/scripts/gradle-version.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}
          cache-disabled: true
      - name: Generate Gradle wrapper if missing
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi

      - name: Validate signing secrets
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret: $name"
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          check_store="$RUNNER_TEMP/release-check.p12"
          check_password="$(openssl rand -hex 24)"
          valid=false
          for source_type in PKCS12 JKS; do
            if keytool -importkeystore \
              -srckeystore "$keystore" \
              -srcstoretype "$source_type" \
              -srcstorepass "$KEYSTORE_PASSWORD" \
              -srcalias "$KEY_ALIAS" \
              -srckeypass "$KEY_PASSWORD" \
              -destkeystore "$check_store" \
              -deststoretype PKCS12 \
              -deststorepass "$check_password" \
              -destkeypass "$check_password" \
              -noprompt >/dev/null 2>&1; then
              valid=true
              break
            fi
          done

          rm -f "$check_store"
          if [ "$valid" != true ]; then
            echo "::error::Release keystore, alias, or passwords do not match."
            exit 1
          fi
          echo "path=$keystore" >> "$GITHUB_OUTPUT"

      - name: Build release APK and AAB
        env:
          LLMBENCH_KEYSTORE: ${{ steps.keystore.outputs.path }}
          LLMBENCH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LLMBENCH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LLMBENCH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :shared:desktopTest :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify and name release artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$apk"
          test -n "$aab"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/aapt2" dump badging "$apk" | grep -F "versionName='$RELEASE_VERSION'"
          aab_files="$RUNNER_TEMP/aab-files.txt"
          unzip -Z1 "$aab" > "$aab_files"
          grep -Eq '^META-INF/.*\.(RSA|DSA|EC)$' "$aab_files"
          jarsigner -verify "$aab" >/dev/null

          cp "$apk" dist/llmbench.apk
          cp "$aab" dist/llmbench.aab

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          tag="llmbench-latest"

          cat > release-notes.md <<EOF
          Signed Android builds from \`${GITHUB_SHA}\`.

          Rolling release. Assets are replaced after each successful build of \`main\`.
          App version: \`${RELEASE_VERSION}\`.
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" \
              -F force=true
            gh release edit "$tag" \
              --title "LlmBench · rolling" \
              --notes-file release-notes.md
          else
            gh release create "$tag" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "LlmBench · rolling" \
              --notes-file release-notes.md
          fi

          gh release upload "$tag" \
            dist/llmbench.apk \
            dist/llmbench.aab \
            --clobber
          gh release edit "$tag" --draft=false --latest
