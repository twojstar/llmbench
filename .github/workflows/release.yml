name: Rolling release

on: # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
    paths:
      - "gradlew"
      - "app/**"
      - "shared/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/scripts/gradle-version.sh"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: llmbench-rolling-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish rolling release
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve app version
        id: release
        run: |
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          if [ -z "$version" ]; then
            echo "::error::app/build.gradle.kts has no versionName."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Read Gradle version
        id: gradle
        run: .github/scripts/gradle-version.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}
          cache-disabled: true
      - name: Generate Gradle wrapper if missing
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi

      - name: Validate signing secrets
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret: $name"
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          check_store="$RUNNER_TEMP/release-check.p12"
          check_password="$(openssl rand -hex 24)"
          valid=false
          for source_type in PKCS12 JKS; do
            if keytool -importkeystore \
              -srckeystore "$keystore" \
              -srcstoretype "$source_type" \
              -srcstorepass "$KEYSTORE_PASSWORD" \
              -srcalias "$KEY_ALIAS" \
              -srckeypass "$KEY_PASSWORD" \
              -destkeystore "$check_store" \
              -deststoretype PKCS12 \
              -deststorepass "$check_password" \
              -destkeypass "$check_password" \
              -noprompt >/dev/null 2>&1; then
              valid=true
              break
            fi
          done

          rm -f "$check_store"
          if [ "$valid" != true ]; then
            echo "::error::Release keystore, alias, or passwords do not match."
            exit 1
          fi
          echo "path=$keystore" >> "$GITHUB_OUTPUT"

      - name: Build release APK and AAB
        env:
          LLMBENCH_KEYSTORE: ${{ steps.keystore.outputs.path }}
          LLMBENCH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LLMBENCH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LLMBENCH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :shared:desktopTest :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify and name release artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$apk"
          test -n "$aab"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/aapt2" dump badging "$apk" | grep -F "versionName='$RELEASE_VERSION'"
          aab_files="$RUNNER_TEMP/aab-files.txt"
          unzip -Z1 "$aab" > "$aab_files"
          grep -Eq '^META-INF/.*\.(RSA|DSA|EC)$' "$aab_files"
          jarsigner -verify "$aab" >/dev/null

          cp "$apk" dist/llmbench.apk
          cp "$aab" dist/llmbench.aab

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          tag="llmbench-latest"
          stage="llmbench-stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          backup="llmbench-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_id=""
          old_id=""
          old_ref_sha=""
          had_old_ref=false
          old_moved=false
          promoted=false

          release_id_for_tag() {
            local wanted="$1"
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$wanted\") | .id"
          }

          cleanup_failed_promotion() {
            status=$?
            trap - EXIT
            set +e

            if [ "$status" -eq 0 ]; then
              return 0
            fi

            echo "::warning::Rolling release promotion failed; cleaning staging state."

            if [ -n "$release_id" ]; then
              gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
                -f tag_name="$stage" -F draft=true -F prerelease=false \
                -f make_latest=false >/dev/null 2>&1 \
                || gh api --method DELETE "repos/$GH_REPO/releases/$release_id" >/dev/null 2>&1 \
                || true
            else
              staged_id="$(release_id_for_tag "$stage" 2>/dev/null || true)"
              if [ -n "$staged_id" ]; then
                gh api --method DELETE "repos/$GH_REPO/releases/$staged_id" >/dev/null 2>&1 || true
              fi
            fi

            tag_restored=true
            if [ "$had_old_ref" = true ]; then
              if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
                if ! gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" \
                  -f sha="$old_ref_sha" -F force=true >/dev/null 2>&1; then
                  tag_restored=false
                fi
              elif ! gh api --method POST "repos/$GH_REPO/git/refs" \
                -f ref="refs/tags/$tag" -f sha="$old_ref_sha" >/dev/null 2>&1; then
                tag_restored=false
              fi
            elif gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
              if ! gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$tag" >/dev/null 2>&1; then
                tag_restored=false
              fi
            fi
            if [ "$tag_restored" != true ]; then
              echo "::error::Could not restore the previous rolling tag; recovery remains under $backup."
            fi

            release_restored=true
            if [ "$old_moved" = true ]; then
              if [ "$tag_restored" = true ]; then
                if ! gh api --method PATCH "repos/$GH_REPO/releases/$old_id" \
                  -f tag_name="$tag" -F draft=false -F prerelease=false \
                  -f make_latest=true >/dev/null 2>&1; then
                  release_restored=false
                  echo "::error::Could not restore the previous rolling release; backup remains under $backup."
                fi
              else
                release_restored=false
              fi
            fi

            if [ -n "$release_id" ]; then
              gh api --method DELETE "repos/$GH_REPO/releases/$release_id" >/dev/null 2>&1 || true
            fi
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$stage" >/dev/null 2>&1 || true
            if [ "$tag_restored" = true ] && [ "$release_restored" = true ]; then
              gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$backup" >/dev/null 2>&1 || true
            elif [ "$old_moved" = true ]; then
              echo "::warning::Recovery backup kept as $backup for manual repair."
            fi

            exit "$status"
          }
          trap cleanup_failed_promotion EXIT

          printf 'Signed Android builds from `%s`.\n\nRolling release. Assets are replaced after each successful build of `main`.\nApp version: `%s`.\n' \
            "$GITHUB_SHA" "$RELEASE_VERSION" > release-notes.md

          gh release create "$stage" dist/llmbench.apk dist/llmbench.aab \
            --draft --target "$GITHUB_SHA" \
            --title "LlmBench · rolling" --notes-file release-notes.md
          release_id="$(release_id_for_tag "$stage")"
          if [ -z "$release_id" ]; then
            echo "::error::Could not resolve the staged draft release."
            exit 1
          fi

          asset_count="$(gh api "repos/$GH_REPO/releases/$release_id/assets" --jq 'length')"
          test "$asset_count" -eq 2

          if old_ref_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then
            had_old_ref=true
          fi
          if old_id="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq .id 2>/dev/null)"; then
            if [ "$had_old_ref" != true ]; then
              echo "::error::Existing rolling release has no matching git tag."
              exit 1
            fi

            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$backup" -f sha="$old_ref_sha" >/dev/null
            gh api --method PATCH "repos/$GH_REPO/releases/$old_id" \
              -f tag_name="$backup" -f make_latest=false >/dev/null
            old_moved=true
          fi

          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
            -f name='LlmBench · rolling' -F draft=false -F prerelease=false \
            -f make_latest=true >/dev/null

          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi
          promoted=true
          trap - EXIT

          gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$stage" >/dev/null 2>&1 || true
          if [ "$old_moved" = true ]; then
            if gh api --method DELETE "repos/$GH_REPO/releases/$old_id" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$backup" >/dev/null 2>&1 || true
            else
              echo "::warning::Previous rolling release kept as $backup because cleanup failed."
            fi
          fi
