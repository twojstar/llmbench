name: One-shot response Markdown review fix

on:
  push:
    branches:
      - gptomek/response-markdown-asset

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gptomek/response-markdown-asset
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Read Gradle version
        id: gradle
        run: .github/scripts/gradle-version.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Generate Gradle wrapper if missing
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi

      - name: Guard active streaming responses
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/twojstar/llmbench/ui/screens/ChatScreen.kt')
          text = path.read_text()
          replacements = [
              (
                  '''                ChatMessageItem(\n                    message = message,\n                    onCopyText = { text ->''',
                  '''                ChatMessageItem(\n                    message = message,\n                    canOpenMarkdown = !message.isPartial || !uiState.isChatGenerating,\n                    onCopyText = { text ->'''
              ),
              (
                  '''fun ChatMessageItem(\n    message: ModelChatMessage,\n    onCopyText: (String) -> Unit,''',
                  '''fun ChatMessageItem(\n    message: ModelChatMessage,\n    canOpenMarkdown: Boolean,\n    onCopyText: (String) -> Unit,'''
              ),
              (
                  '''                            enabled = message.text.isNotBlank() && !message.isError,''',
                  '''                            enabled = canOpenMarkdown && message.text.isNotBlank() && !message.isError,'''
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Test Android and shared modules
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :shared:desktopTest --stacktrace

      - name: Commit review fix as GPTomek
        shell: bash
        run: |
          git config user.name 'gptomek[bot]'
          git config user.email '314538226+gptomek[bot]@users.noreply.github.com'
          git add app/src/main/java/com/twojstar/llmbench/ui/screens/ChatScreen.kt
          rm .github/workflows/one-shot-response-markdown-review-fix.yml
          git add -u .github/workflows/one-shot-response-markdown-review-fix.yml
          git commit -m 'fix: guard streaming response Markdown assets'
          git push origin HEAD:gptomek/response-markdown-asset
