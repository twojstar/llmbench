name: One-shot common regex portability fix

on: # yamllint disable-line rule:truthy
  push:
    branches: [gptomek/fix-common-regex-portability]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Read Gradle version
        id: gradle
        run: .github/scripts/gradle-version.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Generate Gradle wrapper if missing
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi

      - name: Apply asserted portability patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("shared/src/commonMain/kotlin/com/twojstar/llmbench/data/security/TextInspector.kt")
          source = source_path.read_text()
          start = source.index("    private val injectionPatterns = listOf(")
          end = source.index("\n    )", start) + len("\n    )")
          block = source[start:end]
          if block.count("RegexOption.DOT_MATCHES_ALL") != 4:
              raise SystemExit("Expected four DOT_MATCHES_ALL options in injectionPatterns")
          if block.count(".{0,90}") != 2 or block.count(".{0,60}") != 3:
              raise SystemExit("Unexpected wildcard counts in injectionPatterns")
          block = block.replace(".{0,90}", "[\\\\s\\\\S]{0,90}")
          block = block.replace(".{0,60}", "[\\\\s\\\\S]{0,60}")
          block = block.replace(
              "RegexOption.IGNORE_CASE, RegexOption.DOT_MATCHES_ALL",
              "RegexOption.IGNORE_CASE",
          )
          if "DOT_MATCHES_ALL" in block:
              raise SystemExit("DOT_MATCHES_ALL remained after patch")
          source_path.write_text(source[:start] + block + source[end:])

          test_path = Path("shared/src/commonTest/kotlin/com/twojstar/llmbench/data/security/TextInspectorTest.kt")
          tests = test_path.read_text()
          test_name = "detectsPromptInjectionAcrossLineBreaks"
          if test_name in tests:
              raise SystemExit("Multiline regression test already exists")
          marker = "    @Test\n    fun decodesBase64PromptInjection() {"
          if tests.count(marker) != 1:
              raise SystemExit("Expected one Base64 test anchor")
          addition = '''    @Test
          fun detectsPromptInjectionAcrossLineBreaks() {
              val result = TextInspector.inspect("Ignore these notes\\nprevious system instructions")

              assertTrue(result.findings.any { it.label == "Prompt-injection-like instruction" })
          }

          '''
          test_path.write_text(tests.replace(marker, addition + marker))
          PY

      - name: Verify shared common code
        run: ./gradlew :shared:compileCommonMainKotlinMetadata :shared:desktopTest --stacktrace

      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-common-regex-fix.yml
          git config user.name "gptomek[bot]"
          git config user.email "314538226+gptomek[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep common text inspector portable"
          git push origin HEAD:gptomek/fix-common-regex-portability
