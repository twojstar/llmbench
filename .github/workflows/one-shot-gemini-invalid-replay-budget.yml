name: One-shot invalid Gemini replay budget fix

on: # yamllint disable-line rule:truthy
  push:
    branches: [gptomek/gemini-thought-signatures]

jobs:
  validate:
    if: github.event.head_commit.message != 'fix(gemini) reject invalid replay before budgeting'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      validated_sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: base
        name: Capture validated revision
        run: echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Read Gradle version
        id: gradle
        run: .github/scripts/gradle-version.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Generate Gradle wrapper if missing
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
            git checkout -- gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Apply focused patch
        run: python .github/scripts/one-shot-gemini-invalid-replay-budget.py

      - name: Validate
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :shared:desktopTest --stacktrace

      - name: Package validated patch
        run: |
          git diff --binary -- \
            shared/src/commonMain/kotlin/com/twojstar/llmbench/data/model/ConversationHistory.kt \
            shared/src/commonTest/kotlin/com/twojstar/llmbench/data/model/ConversationHistoryTest.kt \
            app/src/main/java/com/twojstar/llmbench/data/engine/AiChatService.kt > /tmp/gemini-invalid-replay-budget.patch
          test -s /tmp/gemini-invalid-replay-budget.patch

      - uses: actions/upload-artifact@v7
        with:
          name: gemini-invalid-replay-budget-patch
          path: /tmp/gemini-invalid-replay-budget.patch
          if-no-files-found: error

  commit:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.validated_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: gemini-invalid-replay-budget-patch
          path: /tmp/gemini-invalid-replay-budget

      - name: Commit verified product changes
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: |
          git fetch origin gptomek/gemini-thought-signatures
          test "$(git rev-parse origin/gptomek/gemini-thought-signatures)" = "$VALIDATED_SHA"
          git apply --index /tmp/gemini-invalid-replay-budget/gemini-invalid-replay-budget.patch
          git config user.name "GPTomek"
          git config user.email "314538226+gptomek[bot]@users.noreply.github.com"
          git commit -m "fix(gemini) reject invalid replay before budgeting"
          git push origin HEAD:gptomek/gemini-thought-signatures
