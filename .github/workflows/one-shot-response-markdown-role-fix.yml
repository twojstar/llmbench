name: One-shot response Markdown role fix
on:
  push:
    branches: [gptomek/response-markdown-asset]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gptomek/response-markdown-asset
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - id: gradle
        run: .github/scripts/gradle-version.sh
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}
      - name: Generate wrapper if missing
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then gradle wrapper --gradle-version "$GRADLE_VERSION"; fi
      - name: Require assistant response role
        run: |
          python3 - <<'PY'
          from pathlib import Path
          screen = Path('app/src/main/java/com/twojstar/llmbench/ui/screens/ChatScreen.kt')
          s = screen.read_text()
          old = 'import com.twojstar.llmbench.data.model.AiProvider\nimport com.twojstar.llmbench.data.model.CHAT_ROLE_USER\n'
          new = 'import com.twojstar.llmbench.data.model.AiProvider\nimport com.twojstar.llmbench.data.model.CHAT_ROLE_ASSISTANT\nimport com.twojstar.llmbench.data.model.CHAT_ROLE_USER\n'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '''        !message.isPartial &&\n        !message.isError &&\n        message.provider != null &&'''
          new = '''        !message.isPartial &&\n        !message.isError &&\n        message.sender == CHAT_ROLE_ASSISTANT &&\n        message.provider != null &&'''
          assert s.count(old) == 1
          screen.write_text(s.replace(old, new, 1))

          test = Path('app/src/test/java/com/twojstar/llmbench/ui/screens/ChatResponseMarkdownEligibilityTest.kt')
          s = test.read_text()
          s = s.replace('import com.twojstar.llmbench.data.model.ModelChatMessage\n', '''import com.twojstar.llmbench.data.model.AiProvider\nimport com.twojstar.llmbench.data.model.CHAT_ROLE_ASSISTANT\nimport com.twojstar.llmbench.data.model.CHAT_ROLE_USER\nimport com.twojstar.llmbench.data.model.ModelChatMessage\n''', 1)
          s = s.replace('sender = "assistant"', 'sender = CHAT_ROLE_ASSISTANT')
          s = s.replace('provider = com.twojstar.llmbench.data.model.AiProvider.CHATGPT', 'provider = AiProvider.CHATGPT')
          s = s.replace('provider = com.twojstar.llmbench.data.model.AiProvider.ALL', 'provider = AiProvider.ALL')
          insert = '''\n    @Test\n    fun userMessageWithProviderIsNotAResponseAsset() {\n        val userMessage = ModelChatMessage(\n            id = "u1",\n            sender = CHAT_ROLE_USER,\n            provider = AiProvider.CHATGPT,\n            text = "User prompt"\n        )\n\n        assertFalse(canOpenResponseAsMarkdown(userMessage, false, false))\n    }\n'''
          assert s.endswith('}\n')
          test.write_text(s[:-2] + insert + '}\n')
          PY
      - name: Build, test and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :shared:desktopTest --stacktrace
      - name: Commit verified fix as GPTomek
        run: |
          rm .github/workflows/one-shot-response-markdown-role-fix.yml
          git config user.name "gptomek[bot]"
          git config user.email "314538226+gptomek[bot]@users.noreply.github.com"
          git add app/src/main/java/com/twojstar/llmbench/ui/screens/ChatScreen.kt app/src/test/java/com/twojstar/llmbench/ui/screens/ChatResponseMarkdownEligibilityTest.kt .github/workflows/one-shot-response-markdown-role-fix.yml
          git commit -m "fix: restrict Markdown assets to assistant responses"
          git push origin HEAD:gptomek/response-markdown-asset
